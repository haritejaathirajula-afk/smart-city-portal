version: '3.8'

services:
  # MySQL Database Service (v8.0)
  mysql:
    image: mysql:8.0
    container_name: smart-city-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: smart_city_db
      MYSQL_USER: smartcity
      MYSQL_PASSWORD: smartcitypassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./server/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./server/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - smart-city-network

  # Smart City Unified Application Server (Backend REST API + Frontend SPA)
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-city-portal
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: smart_city_db
      JWT_SECRET: smartcity_production_super_secret_jwt_key_2026
      JWT_EXPIRES_IN: 7d
    volumes:
      - uploads_data:/app/server/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - smart-city-network

volumes:
  db_data:
    name: smart_city_db_data
  uploads_data:
    name: smart_city_uploads_data

networks:
  smart-city-network:
    name: smart_city_network
    driver: bridge

